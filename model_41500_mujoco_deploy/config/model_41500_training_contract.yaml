# Frozen evaluator contract for model_41500.pt.
#
# This is the box on which the checkpoint was actually trained. It is not the
# later full-table / full-height continuation target in strike_box.yaml.

policy_generation: moving_base_model_41500_v1
source_run: 2026-08-17_22-03-09_resume_25000_gjc_robot_model
source_checkpoint: model_41500.pt
checkpoint_iteration: 41500

motion:
  forehand: hope_training/motions/preprocessed/ours_forehand_guarded_1p8s_wrist_x.npz
  backhand: hope_training/motions/preprocessed/ours_backhand_guarded_1p8s.npz
  sample_rate_hz: 50
  strike_frame_per_clip: [50, 50]
  strike_phase_per_clip: [0.5555555555555556, 0.5555555555555556]
  strike_window_s: 0.12
  lead_time_s: 1.0
  follow_through_s: 0.8
  mount_normal_axis: 1
  mount_normal_sign_per_clip: [1.0, -1.0]

# x/y are relative to the commanded station; z is floor/world height.
racket_position_box:
  forehand:
    x: [0.18, 0.40]
    y: [-0.76, -0.52]
    z: [1.00, 1.21]
  backhand:
    x: [0.45, 0.75]
    y: [-0.30, 0.10]
    z: [0.84, 1.10]

# World-axis target racket velocity used by the legacy evaluator.
racket_velocity_box:
  forehand:
    x: [1.75, 3.40]
    y: [0.25, 1.10]
    z: [0.35, 1.45]
  backhand:
    x: [1.05, 3.00]
    y: [-0.70, 0.60]
    z: [0.45, 1.45]
