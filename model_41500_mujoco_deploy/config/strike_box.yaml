# Strike-box reference for this deployment package.
# Coordinates are floor/world coordinates unless explicitly marked planner/table.

checkpoint_profile:
  name: model_41500_training_box
  base_target_y_range: [-0.35, 0.35]
  swing_side_split_y: -0.41
  swing_side_hysteresis_y: 0.04
  table_surface_z: 0.76
  table_y_range: [-0.7625, 0.7625]

  # Racket target relative to the moving station, exactly as frozen in env.yaml.
  racket_position_box_relative_to_base:
    forehand: {x: [0.18, 0.40], y: [-0.76, -0.52], z: [1.00, 1.21]}
    backhand: {x: [0.45, 0.75], y: [-0.30, 0.10], z: [0.84, 1.10]}

  # Effective table-side target envelope after the checkpoint station range,
  # table clipping, side split, and 4 cm hysteresis are applied.
