    2.9321498871, 0.5235990286, 2.7227098942, 2.4958200455, 0.5235990286, 0.3490659893,
  ]
  source_run: /home/humanoid/Downloads/policy
  policy_onnx_sha256: 036f41bf2b3094f4cf4f1f023a6b084d2e6777d6e05d1c7e484efa38d1fdb442
  policy_pt_sha256: 736c7e87eae88dacdadd9c5d922798be50d9a43e4d4a4322e7a3ae994649c56c

# Right-arm serving trajectory. Arm order is left 7 joints followed by right 7
# joints, matching controlled_joints indices 5..18. Positions are radians.
serve:
  enabled: true
  home: [
      -1.30, 0.00, -0.00, 1.30, 1.57, -1.57, -0.00,   # 左臂
      -0.57, -0.59, 0.65, 0.0, 0.01, 0.04, 0.70,       # 右臂
  ]
  windup_right: [
      -0.33,   # right_shoulder_pitch
      -0.55,   # right_shoulder_roll
      0.71,    # right_shoulder_yaw
      -0.07,   # right_elbow
      -0.20,   # right_wrist_roll
      -0.22,   # right_wrist_pitch
      0.73,    # right_wrist_yaw
  ]
  hit_through_right: [
      -0.55,   # right_shoulder_pitch
      -0.59,   # right_shoulder_roll
      0.56,    # right_shoulder_yaw
      0.03,    # right_elbow
      0.01,   # right_wrist_roll
      0.05,   # right_wrist_pitch
      0.73,    # right_wrist_yaw
  ]
  timing:
    home_s: 5.0
    windup_s: 0.50
    swing_s: 0.03
    # Relative to swing start; valid range is [-windup_s, swing_s].
    release_s: 0.0
    settle_s: 1.0
    return_s: 1.0
    # Once the arm reaches home, enqueue gripper open immediately and keep the
    # arm at home for this duration before reporting ready. This does not wait
    # for confirmation that the asynchronous HTTP/mechanical action completed.
    open_wait_s: 0.5
  gripper:
    host: 10.42.10.12
    port: 56422
    path: /rpc/aimdk.protocol.HalHandService/SetHandCommand
    open_position: 4096
    close_position: 1200
    right_position: 0
    connect_timeout_ms: 3000
    response_timeout_ms: 65000

xml_path: ../sim/agibot_a3/xml/agibot_a3.xml
initial_keyframe: stand
orientation_sensor: pelvis_imu_quat
angular_velocity_sensor: pelvis_imu_gyro

simulation_duration: 120.0
simulation_dt: 0.001
control_decimation: 20
history_length: 5

action_scale: 0.25
ang_vel_scale: 0.2
dof_vel_scale: 0.05

command_default: [0.3, 0.0, 0.0, 1.02]
command_min: [-0.5, -0.4, -0.6, 0.80]
command_max: [0.8, 0.4, 0.6, 1.07]
height_normalization_center: 0.95

# pygame joystick axes: left-stick vertical, left-stick horizontal,
# right-stick horizontal. Negative signs make up/left positive commands.
gamepad_index: 0
gamepad_axes: [1, 0, 3]
gamepad_axis_signs: [-1.0, -1.0, -1.0]
gamepad_deadzone: 0.05
gamepad_hat: 0
gamepad_height_step: 0.02

# MuJoCo actuator order. The policy controls only the 12 leg entries below.
controlled_joints:
  - waist_yaw_joint
  - waist_roll_joint
  - waist_pitch_joint
  - head_yaw_joint
  - head_pitch_joint
  - left_shoulder_pitch_joint
  - left_shoulder_roll_joint
  - left_shoulder_yaw_joint
  - left_elbow_joint
  - left_wrist_roll_joint
  - left_wrist_pitch_joint
  - left_wrist_yaw_joint
  - right_shoulder_pitch_joint
  - right_shoulder_roll_joint
  - right_shoulder_yaw_joint
  - right_elbow_joint
  - right_wrist_roll_joint
  - right_wrist_pitch_joint
  - right_wrist_yaw_joint
  - left_hip_pitch_joint
  - left_hip_roll_joint
  - left_hip_yaw_joint
  - left_knee_joint
  - left_ankle_pitch_joint
  - left_ankle_roll_joint
  - right_hip_pitch_joint
  - right_hip_roll_joint
  - right_hip_yaw_joint
  - right_knee_joint
  - right_ankle_pitch_joint
  - right_ankle_roll_joint

policy_joints:
  - left_hip_pitch_joint
  - left_hip_roll_joint
  - left_hip_yaw_joint
  - left_knee_joint
  - left_ankle_pitch_joint
  - left_ankle_roll_joint
  - right_hip_pitch_joint
  - right_hip_roll_joint
  - right_hip_yaw_joint
  - right_knee_joint
  - right_ankle_pitch_joint
  - right_ankle_roll_joint

# Isaac/PhysX resolves SceneEntityCfg joint observations in articulation order,
# which is breadth-first and therefore interleaves the left and right legs.
observation_joints:
  - left_hip_pitch_joint
  - right_hip_pitch_joint
  - left_hip_roll_joint
  - right_hip_roll_joint
  - left_hip_yaw_joint
  - right_hip_yaw_joint
  - left_knee_joint
  - right_knee_joint
  - left_ankle_pitch_joint
  - right_ankle_pitch_joint
  - left_ankle_roll_joint
  - right_ankle_roll_joint

