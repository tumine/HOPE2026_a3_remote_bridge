hope_planner:
  ros__parameters:
    # --- Topics / frames ---
    poses_topic: "/poses"          # mocap ball stream (geometry_msgs/PoseArray)
    command_topic: "/racket/command"
    frame_id: "world"
    # Which slot in the /poses PoseArray is the ball (PoseArray carries no names;
    # publish the ball first, or set this to its index). Confirm against your
    # live stream, e.g. `ros2 topic echo /poses --once`.
    ball_pose_index: 0

    # --- Strike regions ---
    # model_50000 full-table/full-height checkpoint profile in canonical table
    # coordinates. These are the effective boxes after table clipping and the
    # moving-base station range are projected into the planner frame.
    # A physical prediction outside its side's y/z box, or a planned racket
    # velocity outside its side's envelope, is NOT clipped: no command is
    # published for that ball.
    use_side_aware_strike_regions: true
    forehand_strike_x_range: [-0.32, -0.10]
    forehand_strike_y_range: [-1.5250, -1.1725]
    forehand_strike_z_range: [0.08, 0.45]
    forehand_velocity_x_range: [1.75, 3.40]
    forehand_velocity_y_range: [0.20, 1.10]
    forehand_velocity_z_range: [0.35, 1.60]
    backhand_strike_x_range: [-0.05, 0.25]
    backhand_strike_y_range: [-1.1725, 0.0000]
    backhand_strike_z_range: [0.08, 0.45]
    backhand_velocity_x_range: [1.05, 3.10]
    backhand_velocity_y_range: [-1.10, 0.65]
    backhand_velocity_z_range: [0.35, 1.50]

    # Legacy single-plane fallback, used only when side-aware regions are false.
    x_hit: 0.2

    # --- Forehand / backhand selection ---
    # The side is chosen once per incoming ball by splitting the predicted
    # lateral (y) crossing at swing_side_split_y: y below the split -> FOREHAND,
    # at/above -> BACKHAND.
    # model_50000 full-table side split in the canonical planner table frame.
    swing_side_split_y: -1.1725
    # The checkpoint has no side-selection hysteresis band.
    swing_side_hysteresis_y: 0.0

    # --- Fixed landing target (opponent half) ---
    target_land_x: 2.055           # opponent half-centre x (= table length * 3/4)
    target_land_y: -0.7625         # opponent half-centre y (= -table width / 2)
    # Desired post-strike flight time (s). Shapes the demanded racket speed; tune
    # to your policy's reachable racket-velocity envelope.
    delta_t_flight: 0.5

    # --- Solve / prediction ---
    # Every mocap sample feeds the estimator; the predict+plan solve runs at most
    # every solve_period_s (<= 50 Hz). 0.0 solves on every sample.
    solve_period_s: 0.02
    # A larger timestamp gap means the next sample starts a new physical ball:
    # clear the old fit and release the prior task's locked swing side.
    new_ball_gap_s: 0.25
    # When the ball marker remains visible between rallies, detect a new throw
    # with velocity hysteresis and consecutive solved frames. At the default
    # 50 Hz solve rate, 5/10 frames are about 0.10/0.20 seconds. This prevents
    # stationary-ball velocity noise from repeatedly creating BALL_REARM.
    new_ball_incoming_vx_threshold_mps: -0.50
    new_ball_nonincoming_vx_threshold_mps: -0.10
    new_ball_incoming_confirm_samples: 5
    new_ball_nonincoming_confirm_samples: 10
    new_ball_rearm_min_x: 0.30
    # Frozen model_50000 envelopes above remain exact. These margins are zero in
    # the canonical config and may be overridden only by live deployment.
    strike_y_margin_m: 0.0
    strike_z_margin_m: 0.0
    racket_velocity_margin_mps: 0.0
    # Only NEW tasks are admitted in this closed TTS window, matching the
    # training lead of 1.0 s. Earlier candidates wait for later samples; a ball
    # already below the minimum is dropped without consuming task_id. Revisions
    # of an active task remain allowed below the window through contact.
    new_task_tts_min_s: 0.25
    new_task_tts_max_s: 1.0
    max_predict_time: 2.0          # forward prediction horizon (s)

    # --- Table placement ---
    # Table's +y edge in the play frame (table occupies y in [y_max - width, y_max]).
    table_y_max: 0.0

    # --- Ball physics ---
    # No-spin drag / restitution / gravity / geometry are read from
    # configs/ball_physics.yaml. Leave empty to auto-discover it by walking up
    # from the package, or set an explicit path.
    ball_physics_path: ""
