aimrt:
  plugin:
    plugins:
      - name: iceoryx_plugin
        path: libaimrt_iceoryx_plugin.so
        options:
          shm_init_size: 2048

  log:
    core_lvl: INFO
    backends:
      - type: console
      - type: rotate_file
        options:
          path: /tmp/a3_remote_bridge_logs
          filename: mdu_state_bridge.log
          max_file_size_m: 32
          max_file_num: 4

  executor:
    executors:
      - name: aimrt_callback_pool
        type: asio_thread
        options:
          thread_num: 2

  channel:
    backends:
      - type: iceoryx
    pub_topics_options:
      - topic_name: "/body_drive/waist_joint_command"
        enable_backends: [iceoryx]
      - topic_name: "/body_drive/leg_joint_command"
        enable_backends: [iceoryx]
      - topic_name: "/body_drive/arm_joint_command"
        enable_backends: [iceoryx]
      - topic_name: "/body_drive/neck_joint_command"
        enable_backends: [iceoryx]
    sub_topics_options:
      - topic_name: "(.*)"
        enable_backends: [iceoryx]
