# Shared environment defaults, composed into the task via `defaults: [/base/env_base@_here_]`.
# Override per-task under the task's own `env:` block (or on the CLI: num_envs=1024).
env:
  # Validated on a 12 GB RTX 3080 Ti. Increase only after checking local VRAM headroom.
  num_envs: 1024          # parallel environments
  env_spacing: 2.5        # spacing between env origins (m)
  # Long enough for repeated 1.80 s guarded-retime swings plus U[0, 2] s holds.
  episode_length_s: 10.0
