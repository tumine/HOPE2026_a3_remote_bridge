aimrt:
  plugin:
    plugins:
      - name: iceoryx_plugin
        path: libaimrt_iceoryx_plugin.so
      - name: ros2_plugin
        path: libaimrt_ros2_plugin.so
        options:
          node_name: mujoco_sim_module #创建的ROS2 节点名
          executor_type: SingleThreaded # SingleThreaded/StaticSingleThreaded/MultiThreaded
  log:
    core_lvl: INFO # Trace/Debug/Info/Warn/Error/Fatal/Off
    backends:
      - type: console
  executor:
    executors:
      - name: gui_thread
        type: simple_thread
      - name: sim_thread
        type: asio_thread
        options:
          thread_num: 1
      - name: camera_thread
        type: asio_thread
        options:
          thread_num: 1
      - name: work_thread_pool
        type: asio_thread
        options:
          thread_num: 8
      - name: sensor_thread_pool
        type: asio_thread
        options:
          thread_num: 8
  channel:
    backends:
      - type: ros2
      - type: iceoryx
    sub_topics_options:
      - topic_name: "(.*)"
        enable_backends: [iceoryx]
    pub_topics_options:
      - topic_name: "/tf"
        enable_backends: [ros2]
      - topic_name: "/hal/(.*)"
        enable_backends: [ros2]
      - topic_name: "/heightmap"
        enable_backends: [ros2]
      - topic_name: "(.*)"
        enable_backends: [iceoryx]
  module:
    pkgs:
      - path: libmujoco_sim_pkg.so
        enable_modules: [MujocoSimModule]
    modules:
      - name: MujocoSimModule
        log_lvl: INFO

# Module custom configuration
MujocoSimModule:
  simulation_model_path: ../models/a3_ultra_t2d0/mjcf/a3_ultra_t2d0_plus.xml  # packaged relative path
  sim_executor: sim_thread
  gui_executor: gui_thread
  subscriber_options:
    - topic: /body_drive/waist_joint_command
      type: joint_actuator_ros2
