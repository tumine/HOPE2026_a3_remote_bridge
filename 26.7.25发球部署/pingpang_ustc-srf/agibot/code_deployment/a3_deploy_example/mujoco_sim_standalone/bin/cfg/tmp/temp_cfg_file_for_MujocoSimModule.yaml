simulation_model_path: ../models/a3_t2d0/mjcf/a3_t2d0.xml
sim_executor: sim_thread
gui_executor: gui_thread
subscriber_options:
  - topic: /body_drive/waist_joint_command
    type: joint_actuator_ros2
    options:
      joints:
        - name: waist_yaw_joint
          bind_joint: waist_yaw_joint
        - name: waist_roll_joint
          bind_joint: waist_roll_joint
        - name: waist_pitch_joint
          bind_joint: waist_pitch_joint
  - topic: /body_drive/leg_joint_command
    type: joint_actuator_ros2
    options:
      joints:
        - name: left_hip_pitch_joint
          bind_joint: left_hip_pitch_joint
        - name: left_hip_roll_joint
          bind_joint: left_hip_roll_joint
        - name: left_hip_yaw_joint
          bind_joint: left_hip_yaw_joint
        - name: left_knee_joint
          bind_joint: left_knee_joint
        - name: left_ankle_pitch_joint
          bind_joint: left_ankle_pitch_joint
        - name: left_ankle_roll_joint
          bind_joint: left_ankle_roll_joint
        - name: right_hip_pitch_joint
          bind_joint: right_hip_pitch_joint
        - name: right_hip_roll_joint
          bind_joint: right_hip_roll_joint
        - name: right_hip_yaw_joint
          bind_joint: right_hip_yaw_joint
        - name: right_knee_joint
          bind_joint: right_knee_joint
        - name: right_ankle_pitch_joint
          bind_joint: right_ankle_pitch_joint
        - name: right_ankle_roll_joint
          bind_joint: right_ankle_roll_joint
  - topic: /body_drive/arm_joint_command
    type: joint_actuator_ros2
    options:
      joints:
        - name: left_shoulder_pitch_joint
          bind_joint: left_shoulder_pitch_joint
        - name: left_shoulder_roll_joint
          bind_joint: left_shoulder_roll_joint
        - name: left_shoulder_yaw_joint
          bind_joint: left_shoulder_yaw_joint
        - name: left_elbow_joint
          bind_joint: left_elbow_joint
        - name: left_wrist_roll_joint
          bind_joint: left_wrist_roll_joint
        - name: left_wrist_pitch_joint
          bind_joint: left_wrist_pitch_joint
        - name: left_wrist_yaw_joint
          bind_joint: left_wrist_yaw_joint
        - name: right_shoulder_pitch_joint
          bind_joint: right_shoulder_pitch_joint
        - name: right_shoulder_roll_joint
          bind_joint: right_shoulder_roll_joint
        - name: right_shoulder_yaw_joint
          bind_joint: right_shoulder_yaw_joint
        - name: right_elbow_joint
          bind_joint: right_elbow_joint
        - name: right_wrist_roll_joint
          bind_joint: right_wrist_roll_joint
        - name: right_wrist_pitch_joint
          bind_joint: right_wrist_pitch_joint
        - name: right_wrist_yaw_joint
          bind_joint: right_wrist_yaw_joint
  - topic: /body_drive/neck_joint_command
    type: joint_actuator_ros2
    options:
      joints:
        - name: head_yaw_joint
          bind_joint: head_yaw_joint
        - name: head_pitch_joint
          bind_joint: head_pitch_joint
publisher_options:
  - topic: /body_drive/waist_joint_state
    frequency: 1000
    executor: work_thread_pool
    type: joint_sensor_ros2
    options:
      joints:
        - name: waist_yaw_joint
          bind_joint: waist_yaw_joint
        - name: waist_roll_joint
          bind_joint: waist_roll_joint
        - name: waist_pitch_joint
          bind_joint: waist_pitch_joint
  - topic: /body_drive/leg_joint_state
    frequency: 1000
    executor: work_thread_pool
    type: joint_sensor_ros2
    options:
      joints:
        - name: left_hip_pitch_joint
          bind_joint: left_hip_pitch_joint
        - name: left_hip_roll_joint
          bind_joint: left_hip_roll_joint
        - name: left_hip_yaw_joint
          bind_joint: left_hip_yaw_joint
        - name: left_knee_joint
          bind_joint: left_knee_joint
        - name: left_ankle_pitch_joint
          bind_joint: left_ankle_pitch_joint
        - name: left_ankle_roll_joint
          bind_joint: left_ankle_roll_joint
        - name: right_hip_pitch_joint
          bind_joint: right_hip_pitch_joint
        - name: right_hip_roll_joint
          bind_joint: right_hip_roll_joint
        - name: right_hip_yaw_joint
          bind_joint: right_hip_yaw_joint
        - name: right_knee_joint
          bind_joint: right_knee_joint
        - name: right_ankle_pitch_joint
          bind_joint: right_ankle_pitch_joint
        - name: right_ankle_roll_joint
          bind_joint: right_ankle_roll_joint
  - topic: /body_drive/arm_joint_state
    frequency: 1000
    executor: work_thread_pool
    type: joint_sensor_ros2
    options:
      joints:
        - name: left_shoulder_pitch_joint
          bind_joint: left_shoulder_pitch_joint
        - name: left_shoulder_roll_joint
          bind_joint: left_shoulder_roll_joint
        - name: left_shoulder_yaw_joint
          bind_joint: left_shoulder_yaw_joint
        - name: left_elbow_joint
          bind_joint: left_elbow_joint
        - name: left_wrist_roll_joint
          bind_joint: left_wrist_roll_joint
        - name: left_wrist_pitch_joint
          bind_joint: left_wrist_pitch_joint
        - name: left_wrist_yaw_joint
          bind_joint: left_wrist_yaw_joint
        - name: right_shoulder_pitch_joint
          bind_joint: right_shoulder_pitch_joint
        - name: right_shoulder_roll_joint
          bind_joint: right_shoulder_roll_joint
        - name: right_shoulder_yaw_joint
          bind_joint: right_shoulder_yaw_joint
        - name: right_elbow_joint
          bind_joint: right_elbow_joint
        - name: right_wrist_roll_joint
          bind_joint: right_wrist_roll_joint
        - name: right_wrist_pitch_joint
          bind_joint: right_wrist_pitch_joint
        - name: right_wrist_yaw_joint
          bind_joint: right_wrist_yaw_joint
  - topic: /body_drive/neck_joint_state
    frequency: 1000
    executor: work_thread_pool
    type: joint_sensor_ros2
    options:
      joints:
        - name: head_yaw_joint
          bind_joint: head_yaw_joint
        - name: head_pitch_joint
          bind_joint: head_pitch_joint
  - topic: /body_drive/pelvis_imu/data
    frequency: 500
    executor: work_thread_pool
    type: imu_sensor_ros2
    options:
      bind_site: imu_in_pelvis
      bind_framequat: pelvis-orientation
      bind_gyro: pelvis-angular-velocity
      bind_accelerometer: pelvis-linear-acceleration
  - topic: /body_drive/torso_imu/data
    frequency: 500
    executor: work_thread_pool
    type: imu_sensor_ros2
    options:
      bind_site: imu_in_torso
      bind_framequat: torso-orientation
      bind_gyro: torso-angular-velocity
      bind_accelerometer: torso-linear-acceleration
  - topic: /tf
    frequency: 100
    executor: work_thread_pool
    type: odometry_ros2
    options:
      bind_site: body
      bind_framequat: pelvis-orientation
      bind_framepos: pelvis-linear-pos